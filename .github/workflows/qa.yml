name: First version QA

on:
  push:
    branches: ["main", "work/first-working-version", "work/local-preview-smoke", "feat/landing-launcher-cleanup"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-and-route-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: node scripts/qa-checks.mjs
      - name: GitHub Pages build smoke test
        run: node scripts/build-pages.mjs
      - name: Local HTTP route smoke test
        run: node scripts/preview-smoke.mjs
